<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Studio</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              bg: '#0B0C10',
              surface: '#14161C',
              'surface-raised': '#1B1E26',
              border: '#262A35',
              'text-primary': '#E8EAF0',
              'text-muted': '#9AA1B2',
              violet: '#7C5CFF',
              'violet-hover': '#8F75FF',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          boxShadow: {
            'card': '0 24px 48px -12px rgba(0, 0, 0, 0.7), 0 0 0 1px #262A35',
            'glow': '0 0 120px 40px rgba(124, 92, 255, 0.12)',
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0B0C10;
      color: #E8EAF0;
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="min-h-screen bg-[#0B0C10] flex flex-col items-center justify-between p-6 relative overflow-hidden select-none">
  
  <!-- Subtle Ambient Violet Radial Glow behind the card -->
  <div class="absolute inset-0 pointer-events-none flex items-center justify-center">
    <div class="w-[600px] h-[600px] rounded-full bg-[#7C5CFF] opacity-[0.08] blur-[140px] transform -translate-y-6"></div>
    <div class="w-[300px] h-[300px] rounded-full bg-[#7C5CFF] opacity-[0.12] blur-[80px] transform -translate-y-6"></div>
    <!-- Subtle grid overlay -->
    <div class="absolute inset-0 opacity-[0.03]" style="background-image: radial-gradient(#E8EAF0 1px, transparent 1px); background-size: 24px 24px;"></div>
  </div>

  <!-- Top spacer / subtle back link if needed -->
  <div class="w-full max-w-[400px] flex items-center justify-end z-10 pt-2">
    <a href="#" class="text-xs text-[#9AA1B2] hover:text-[#E8EAF0] transition-colors flex items-center gap-1.5 py-1 px-2.5 rounded-lg hover:bg-[#14161C] border border-transparent hover:border-[#262A35]">
      <i data-lucide="help-circle" class="w-3.5 h-3.5"></i>
      <span>Help & Support</span>
    </a>
  </div>

  <!-- Centered 400px Card -->
  <main class="w-full max-w-[400px] z-10 my-auto py-8">
    <div class="bg-[#14161C] border border-[#262A35] rounded-2xl p-8 shadow-card relative backdrop-blur-sm">
      
      <!-- Logo & Brand Header -->
      <div class="flex flex-col items-center text-center mb-8">
        <!-- Logo Mark (Consistent with Studio creative brand icon) -->
        <div class="w-12 h-12 rounded-xl bg-[#1B1E26] border border-[#262A35] flex items-center justify-center mb-4 shadow-inner group transition-transform duration-200 hover:scale-105">
          <div class="relative w-6 h-6 flex items-center justify-center">
            <!-- Studio Prism / Aperture Logo Geometry -->
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="#7C5CFF" fill-opacity="0.85" stroke="#8F75FF" stroke-width="1.25" stroke-linejoin="round"/>
              <path d="M2 17L12 22L22 17" stroke="#7C5CFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M2 12L12 17L22 12" stroke="#E8EAF0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>

        <h1 class="text-2xl font-bold tracking-tight text-[#E8EAF0] mb-1.5 flex items-center gap-2">
          <span>Studio</span>
          <span class="text-[10px] uppercase font-mono tracking-wider px-1.5 py-0.5 rounded bg-[#1B1E26] text-[#7C5CFF] border border-[#7C5CFF]/30">Pro</span>
        </h1>
        <p class="text-sm text-[#9AA1B2] font-normal">
          Create images and videos with AI
        </p>
      </div>

      <!-- Action Section -->
      <div class="space-y-5">
        
        <!-- Continue with Google (Full-width Secondary Button) -->
        <button type="button" class="w-full h-11 px-4 rounded-lg bg-[#1B1E26] hover:bg-[#20242e] border border-[#262A35] hover:border-[#343946] text-[#E8EAF0] font-medium text-sm flex items-center justify-center gap-3 transition-all duration-150 active:scale-[0.99] focus:outline-none focus:ring-2 focus:ring-[#7C5CFF]/50">
          <!-- Official Google SVG Icon -->
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
          </svg>
          <span>Continue with Google</span>
        </button>

        <!-- Divider with "or" -->
        <div class="relative flex items-center justify-center my-6">
          <div class="w-full border-t border-[#262A35]"></div>
          <span class="absolute px-3 bg-[#14161C] text-xs uppercase tracking-wider text-[#9AA1B2] font-mono">or</span>
        </div>

        <!-- Magic Link Form -->
        <form class="space-y-4" onsubmit="event.preventDefault();">
          <div>
            <label for="email" class="block text-xs font-medium text-[#9AA1B2] mb-1.5">
              Work or personal email
            </label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-[#9AA1B2]">
                <i data-lucide="mail" class="w-4 h-4"></i>
              </div>
              <input 
                id="email" 
                type="email" 
                placeholder="name@company.com" 
                required
                class="w-full h-11 pl-10 pr-3.5 rounded-lg bg-[#0B0C10] border border-[#262A35] text-[#E8EAF0] placeholder-[#9AA1B2]/50 text-sm focus:outline-none focus:border-[#7C5CFF] focus:ring-1 focus:ring-[#7C5CFF] transition-all"
              />
            </div>
          </div>

          <!-- Primary Violet Button "Send magic link" -->
          <button 
            type="submit" 
            class="w-full h-11 px-4 rounded-lg bg-[#7C5CFF] hover:bg-[#8F75FF] text-white font-medium text-sm flex items-center justify-center gap-2 transition-all duration-150 active:scale-[0.99] shadow-sm hover:shadow-[0_0_20px_rgba(124,92,255,0.35)] focus:outline-none focus:ring-2 focus:ring-[#8F75FF]"
          >
            <span>Send magic link</span>
            <i data-lucide="arrow-right" class="w-4 h-4"></i>
          </button>
        </form>

        <!-- Notification pill / Single sign-on hint -->
        <div class="pt-2 flex items-center justify-center gap-2 text-xs text-[#9AA1B2]/80">
          <i data-lucide="shield-check" class="w-3.5 h-3.5 text-[#34D399]"></i>
          <span>Passwordless authentication via email</span>
        </div>

      </div>

    </div>
  </main>

  <!-- Small Footer Links: Terms and Privacy -->
  <footer class="w-full max-w-[400px] z-10 pb-4 text-center">
    <div class="flex items-center justify-center space-x-4 text-xs text-[#9AA1B2]">
      <a href="#" class="hover:text-[#E8EAF0] transition-colors underline-offset-4 hover:underline">Terms of Service</a>
      <span class="text-[#262A35]">•</span>
      <a href="#" class="hover:text-[#E8EAF0] transition-colors underline-offset-4 hover:underline">Privacy Policy</a>
      <span class="text-[#262A35]">•</span>
      <a href="#" class="hover:text-[#E8EAF0] transition-colors underline-offset-4 hover:underline">System Status</a>
    </div>
  </footer>

  <script>
    // Initialize Lucide icons
    lucide.createIcons();
  </script>
</body>
</html>
