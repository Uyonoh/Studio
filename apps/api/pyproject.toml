[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "api"
version = "0.1.0"
description = "AI Content Studio FastAPI Service"
requires-python = ">=3.12"
dependencies = [
    "studio-core",
    "studio-providers",
    "studio-media",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
