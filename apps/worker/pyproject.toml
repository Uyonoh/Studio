[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "worker"
version = "0.1.0"
description = "AI Content Studio ARQ Worker Service"
requires-python = ">=3.12"
dependencies = [
    "studio-core",
    "studio-providers",
    "studio-media",
    "arq>=0.26.0",
    "redis>=5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]
