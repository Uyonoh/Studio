[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "studio-media"
version = "0.1.0"
description = "AI Content Studio Media Utilities"
requires-python = ">=3.12"
dependencies = [
    "pillow>=10.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/studio_media"]
