[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "studio-providers"
version = "0.1.0"
description = "AI Content Studio Providers Package"
requires-python = ">=3.12"
dependencies = [
    "studio-core",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/studio_providers"]
