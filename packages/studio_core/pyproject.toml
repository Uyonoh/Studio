[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "studio-core"
version = "0.1.0"
description = "AI Content Studio Core Package"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "asyncpg>=0.29.0",
    "jsonschema>=4.20.0",
    "arq>=0.26.0",
    "redis>=5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/studio_core"]
