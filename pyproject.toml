[project]
name = "studio-monorepo"
version = "0.1.0"
description = "AI Content Studio Monorepo"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/worker",
    "packages/studio_core",
    "packages/studio_providers",
    "packages/studio_media",
]

[tool.uv.sources]
studio-core = { workspace = true }
studio-providers = { workspace = true }
studio-media = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "types-redis>=4.6.0.20240425",
    "hypothesis>=6.170.0",
    "jsonschema>=4.26.0",
    "pytest-mock>=3.16.0",
    "asyncpg-stubs>=0.32.0",
    "types-jsonschema>=4.26.0.20261006",
    "respx>=0.23.1",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["api", "worker", "studio_core", "studio_providers", "studio_media"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
minversion = "7.0"
asyncio_mode = "auto"
addopts = ["--import-mode=importlib"]
testpaths = [
    "apps/api/tests",
    "apps/worker/tests",
    "packages/studio_core/tests",
    "packages/studio_providers/tests",
    "packages/studio_media/tests",
    "tests/e2e_backend",
    "tests/infra",
]
